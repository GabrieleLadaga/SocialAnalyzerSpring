server:
  port: 8080

spring:
  application:
    name: social-analyzer-backend

# Configurazione GCP
gcp:
  project-id: ${GCP_PROJECT_ID}
  firestore:
    database-id: ${FIRESTORE_DATABASE_ID:(default)}
  pubsub:
    topic-id: ${PUBSUB_TOPIC_ID:analysis-topic}
    subscription-id: ${PUBSUB_SUBSCRIPTION_ID:analysis-sub}
  storage:
    bucket-name: ${STORAGE_BUCKET_NAME:social-reports-bucket}

# Configurazione JWT 
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# API Keys
apify:
  token: ${APIFY_TOKEN}

gemini:
  api-key: ${GEMINI_API_KEY}
